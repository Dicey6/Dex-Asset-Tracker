kind = "web"
previewPath = "/"
title = "Dyorly — Dyor but smarter"
description = "Dyorly is a dark, premium Solana token intelligence workspace for analyzing tokens, market activity, holders, liquidity, developer behavior, and wallet relationships from one fast homepage."
version = "1.0.0"
id = "artifacts/prowler"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26207

[services.development]
run = "pnpm --filter @workspace/prowler run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/prowler", "run", "build" ]
serve = "static"
publicDir = "artifacts/prowler/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26207"
BASE_PATH = "/"
